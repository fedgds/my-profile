<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber — Trình phát nhạc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --void:#0A0906;
  --surface:#141009;
  --elevated:#1D1710;
  --elevated-2:#2A2116;
  --amber:#E8A752;
  --amber-bright:#FFC773;
  --copper:#C4703F;
  --text-primary:#F5EFE2;
  --text-muted:#9C9182;
  --text-faint:#57503F;
  --line:#2A2318;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  height:100%;
  background:var(--void);
  color:var(--text-primary);
  font-family:var(--font-body);
  overflow:hidden;
}

button{ font-family:inherit; cursor:pointer; }
input[type="range"]{ font-family:inherit; }

:focus-visible{
  outline:2px solid var(--amber-bright);
  outline-offset:3px;
  border-radius:4px;
}

.app{
  position:relative;
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:1fr 320px;
  grid-template-rows:minmax(0, 1fr);
  overflow:hidden;
}

#bgCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.55;
  pointer-events:none;
}

/* ===== Stage ===== */
.stage{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:32px 24px;
  min-width:0;
  min-height:0;
  overflow-y:auto;
}

.glow-orb{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  width:520px;
  height:520px;
  background:radial-gradient(circle, rgba(232,167,82,.16) 0%, rgba(232,167,82,0) 70%);
  pointer-events:none;
  z-index:-1;
}

.disc-wrap{
  position:relative;
  width:min(320px, 40vh);
  height:min(320px, 40vh);
  display:flex;
  align-items:center;
  justify-content:center;
}

#ringCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.disc{
  width:62%;
  height:62%;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%, #3a2f20 0%, #1a140c 55%, #0c0906 100%);
  box-shadow:
    0 0 0 1px rgba(232,167,82,.15),
    0 12px 40px rgba(0,0,0,.55),
    inset 0 0 0 10px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  animation:spin 14s linear infinite;
  animation-play-state:paused;
  position:relative;
}
.disc::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:repeating-radial-gradient(circle, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 2px, transparent 5px);
}
.disc.spinning{ animation-play-state:running; }

.disc-label{
  width:30%;
  height:30%;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%, var(--amber-bright), var(--copper) 75%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.1rem;
  color:#1a1206;
  box-shadow:0 0 0 3px rgba(10,9,6,.6);
  z-index:1;
}

@keyframes spin{ to{ transform:rotate(360deg); } }

.track-meta{
  text-align:center;
  max-width:520px;
  min-width:0;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:.7rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--amber);
  margin-bottom:6px;
}
#trackTitle{
  font-family:var(--font-display);
  font-size:clamp(1.3rem, 3vw, 2rem);
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#trackArtist{
  color:var(--text-muted);
  font-size:.95rem;
  margin-top:4px;
}

/* ===== Waveform / seek ===== */
.waveform-wrap{
  width:min(640px, 90%);
}
#waveCanvas{
  width:100%;
  height:64px;
  display:block;
  cursor:pointer;
}
.time-row{
  display:flex;
  justify-content:space-between;
  font-family:var(--font-mono);
  font-size:.75rem;
  color:var(--text-muted);
  margin-top:2px;
}

/* ===== Controls ===== */
.controls{
  display:flex;
  align-items:center;
  gap:18px;
}
.icon-btn{
  background:none;
  border:none;
  color:var(--text-muted);
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:color .15s ease, background .15s ease, transform .1s ease;
}
.icon-btn:hover{ color:var(--text-primary); background:rgba(255,255,255,.05); }
.icon-btn:active{ transform:scale(.92); }
.icon-btn.active{ color:var(--amber-bright); }
.icon-btn svg{ width:18px; height:18px; }

.play-btn{
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:linear-gradient(150deg, var(--amber-bright), var(--copper));
  color:#1a1206;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 22px rgba(232,167,82,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
.play-btn:hover{ transform:scale(1.05); box-shadow:0 8px 28px rgba(232,167,82,.5); }
.play-btn:active{ transform:scale(.96); }
.play-btn svg{ width:22px; height:22px; }

.volume-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:min(220px, 60%);
  color:var(--text-muted);
}
.volume-row svg{ width:16px; height:16px; flex-shrink:0; }

input[type="range"]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:4px;
  border-radius:2px;
  background:var(--line);
  outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:13px; height:13px;
  border-radius:50%;
  background:var(--amber-bright);
  cursor:pointer;
  box-shadow:0 0 0 3px rgba(232,167,82,.2);
}
input[type="range"]::-moz-range-thumb{
  width:13px; height:13px; border:none; border-radius:50%;
  background:var(--amber-bright); cursor:pointer;
}
#volumeSlider{ flex:1; }

/* ===== Playlist panel ===== */
.playlist-panel{
  position:relative;
  z-index:3;
  background:linear-gradient(180deg, var(--surface), var(--void));
  border-left:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  height:100%;
}
.playlist-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 20px 14px;
  border-bottom:1px solid var(--line);
}
.playlist-header h2{
  font-family:var(--font-display);
  font-size:1rem;
  font-weight:600;
}
.playlist-list{
  list-style:none;
  overflow-y:auto;
  overscroll-behavior:contain;
  flex:1;
  min-height:0;
  padding:8px 10px;
}
.playlist-list::-webkit-scrollbar{ width:6px; }
.playlist-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

.playlist-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 10px;
  border-radius:10px;
  cursor:pointer;
  transition:background .15s ease;
}
.playlist-item:hover{ background:var(--elevated); }
.playlist-item.playing{ background:var(--elevated-2); }

.pl-index{
  width:20px;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--text-faint);
  text-align:center;
  flex-shrink:0;
}
.playlist-item.playing .pl-index{ color:var(--amber-bright); }
.pl-eq{
  width:14px; height:14px; flex-shrink:0;
  display:none;
}
.playlist-item.playing .pl-eq{ display:block; }
.pl-eq rect{ fill:var(--amber-bright); }

.pl-info{ min-width:0; flex:1; }
.pl-title{
  font-size:.86rem; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pl-artist{
  font-size:.74rem; color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pl-remove{
  background:none; border:none; color:var(--text-faint);
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; opacity:0; transition:opacity .15s ease, color .15s ease;
}
.playlist-item:hover .pl-remove{ opacity:1; }
.pl-remove:hover{ color:var(--amber-bright); background:rgba(255,255,255,.06); }
.pl-remove svg{ width:13px; height:13px; }

.empty-hint{
  text-align:center;
  color:var(--text-faint);
  font-size:.82rem;
  padding:30px 24px;
  line-height:1.5;
}

/* mobile playlist toggle */
.playlist-toggle{
  display:none;
  position:fixed;
  top:18px; right:18px;
  z-index:20;
  width:42px; height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text-primary);
  align-items:center; justify-content:center;
}
.playlist-toggle svg{ width:18px; height:18px; }

@media (max-width: 860px){
  .app{ grid-template-columns:1fr; }
  .playlist-panel{
    position:fixed;
    top:0; right:0;
    width:min(320px, 84vw);
    height:100%;
    transform:translateX(100%);
    transition:transform .28s ease;
    box-shadow:-10px 0 30px rgba(0,0,0,.4);
  }
  .playlist-panel.open{ transform:translateX(0); }
  .playlist-toggle{ display:flex; }
  .stage{ padding:60px 18px 28px; }
}

@media (prefers-reduced-motion: reduce){
  .disc{ animation:none; }
  *{ transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <canvas id="bgCanvas"></canvas>

  <main class="stage">
    <div class="glow-orb" aria-hidden="true"></div>

    <div class="disc-wrap">
      <canvas id="ringCanvas" width="400" height="400" aria-hidden="true"></canvas>
      <div class="disc" id="disc">
        <div class="disc-label" id="discLabel">♪</div>

    <div class="track-meta">

    </div>

    <div class="waveform-wrap">
      <canvas id="waveCanvas" height="64" role="slider" aria-label="Tua bài hát" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
      <div class="time-row">
        <span id="curTime">0:00</span>

      </button>
      <button class="icon-btn" id="nextBtn" aria-label="Bài tiếp theo" title="Bài tiếp theo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM14.5 12l-9 6V6z"></path></svg>
      </button>
      <button class="icon-btn" id="repeatBtn" aria-label="Lặp lại" aria-pressed="false" title="Lặp lại">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>

    <div class="volume-row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zM16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"></path></svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="Âm lượng">
    </div>
  </main>

  <aside class="playlist-panel" id="playlistPanel">
    <div class="playlist-header">
      <h2>Danh sách phát</h2>
    </div>
    <ul class="playlist-list" id="playlistList"></ul>
    <p class="empty-hint" id="emptyHint">Chưa có bài hát nào.</p>
  </aside>

  <button class="playlist-toggle" id="playlistToggle" aria-label="Mở danh sách phát">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
  </button>
</div>

<audio id="audioEl" preload="metadata" crossorigin="anonymous"></audio>

<script>
(function(){
  "use strict";

  // =====================================================================
  // Danh sách nhạc lấy từ thư mục /music (đặt cạnh file playlist.html này)
  // Chỉ cần chỉnh sửa mảng này để thêm/bớt bài hát.
  // =====================================================================
  const MUSIC_FOLDER = 'music/';
  const MANUAL_TRACK_FILES = [
    'anh_nho_ra.mp3',
    'beo_dat_may_troi.mp3',
    'binh_yen.mp3',
    'bong_hoa_dep_nhat.mp3',
    'buoc_qua_mua_co_don.mp3',
    'buoc_qua_nhau.mp3',
    'buon_thi_cu_khoc_di.mp3',
    'doan_ket_moi.mp3',
    'duong_toi_cho_em_ve.mp3',
    'dusk_till_dawn.mp3',
    'dynasty.mp3',
    'fool_for_you.mp3',
    'giac_mo_trua.mp3',
    'i_really_want_to_stay_at_your_house.mp3',
    'khong_sao_ma_em_day_roi.mp3',
    'MASHUP-Scars-to-your-beautiful_x_Umbrella_x_Something-just-like-this.mp3',
    'mine.mp3',
    'mua_mua_ay.mp3',
    'nandemonaiya.mp3',
    'nang_tho.mp3',
    'nang_tho_xu_hue.mp3',
    'neu_nhung_tiec_nuoi.mp3',
    'nhung_loi_hua_bo_quen.mp3',
    'pastlives.mp3',
    'que_toi.mp3',
    'sinh_ra_da_la_thu_doi_lap_nhau.mp3',
    'thang_dien.mp3',
    'that_girl_x_talking_to_the_moon.mp3',
    'them_bao_nhieu_lau.mp3',
    'thu_cuoi.mp3',
    'trap_queen.mp3',
    'umbrella.mp3',
    'unstoppable.mp3',
    'waiting_for_love.mp3',
    'where_we_started.mp3',
    'wicked_wonderland.mp3',
    'xe_dap.mp3',
  ];

  // ---------- DOM ----------
  const app = document.getElementById('app');
  const audioEl = document.getElementById('audioEl');
  const bgCanvas = document.getElementById('bgCanvas');
  const ringCanvas = document.getElementById('ringCanvas');
  const waveCanvas = document.getElementById('waveCanvas');
  const disc = document.getElementById('disc');
  const discLabel = document.getElementById('discLabel');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const back15Btn = document.getElementById('back15Btn');
  const fwd15Btn = document.getElementById('fwd15Btn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const playlistList = document.getElementById('playlistList');
  const emptyHint = document.getElementById('emptyHint');
  const playlistPanel = document.getElementById('playlistPanel');
  const playlistToggle = document.getElementById('playlistToggle');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- State ----------
  let playlist = [];        // { file, url, name, artist, duration, peaks }
  let currentIndex = -1;
  let isPlaying = false;
  let shuffle = false;
  let repeatMode = 'off';   // off | all | one
  let seeking = false;

  // ---------- Audio graph ----------
  let audioCtx = null; // giữ lại tên biến rỗng để tránh lỗi ở nơi khác vô tình tham chiếu

  // Lưu ý quan trọng: KHÔNG route audioEl qua AudioContext/AnalyserNode nữa.
  // createMediaElementSource() từng bắt buộc âm thanh phải phát qua AudioContext,
  // và iOS suspend AudioContext đó khi khoá màn hình → mất tiếng. Giờ audioEl
  // phát hoàn toàn "native" (giống hệt cách file index.html mẫu làm), nên nhạc
  // tiếp tục chạy bình thường khi khoá máy / chuyển app.
  let decodeCtx = null; // chỉ dùng để decode waveform preview, KHÔNG dính tới output âm thanh
  function ensureDecodeCtx(){
    if (decodeCtx) return decodeCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    decodeCtx = new AC();
    return decodeCtx;
  }

  // ---------- Hiệu ứng sóng/vòng tròn giả lập (không phụ thuộc AnalyserNode) ----------
  // Vì không còn analyser thật, ta tạo amplitude "giả" theo dạng tổng nhiều sóng sin
  // lệch pha để nhìn vẫn sống động, không cần đọc dữ liệu tần số thực từ audio.
  const fakeAmpSeed = Math.random() * 1000;
  function getFakeAmplitude(t){
    const a = 0.5 + 0.5 * Math.sin(t * 2.3 + fakeAmpSeed);
    const b = 0.5 + 0.5 * Math.sin(t * 4.7 + fakeAmpSeed * 1.3);
    const c = 0.5 + 0.5 * Math.sin(t * 1.1 + fakeAmpSeed * 0.7);
    return a * 0.5 + b * 0.3 + c * 0.2;
  }
  function getLiveAmplitude(){
    return getFakeAmplitude(performance.now() / 1000);
  }

  // ---------- Utils ----------
  function fmtTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function niceName(filename){
    const withoutExt = filename.replace(/\.[^/.]+$/, '');
    return withoutExt.replace(/[_\-]+/g, ' ').trim() || 'Không rõ tên';
  }

  function defaultPeaks(n){
    return Array.from({length: n}, (_, i) => 0.12 + 0.06 * Math.abs(Math.sin(i * 1.3)));
  }

  async function decodePeaksFromArrayBuffer(buf, samples = 72){
    try{
      const ctx = ensureDecodeCtx();
      const audioBuffer = await ctx.decodeAudioData(buf.slice(0));
      const raw = audioBuffer.getChannelData(0);
      const blockSize = Math.max(1, Math.floor(raw.length / samples));
      const peaks = [];
      for (let i = 0; i < samples; i++){
        let sum = 0;
        const start = i * blockSize;
        const end = Math.min(start + blockSize, raw.length);
        for (let j = start; j < end; j++) sum += Math.abs(raw[j]);
        peaks.push(sum / Math.max(1, end - start));
      }
      const max = Math.max(...peaks) || 1;
      return peaks.map(p => Math.max(0.06, Math.min(1, p / max)));
    } catch(e){
      return defaultPeaks(samples);
    }
  }

  async function computePeaksUrl(url, samples = 72){
    try{
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
      const buf = await resp.arrayBuffer();
      return decodePeaksFromArrayBuffer(buf, samples);
    } catch(e){
      return defaultPeaks(samples);
    }
  }

  // ---------- Playlist management ----------

  // Nạp danh sách nhạc cố định từ thư mục /music (MANUAL_TRACK_FILES).
  // Lưu ý: cần chạy trang qua một máy chủ web cục bộ (vd: `python -m http.server`)
  // vì trình duyệt thường chặn fetch() khi mở trực tiếp file HTML (file://).
  function loadManualTracks(){
    MANUAL_TRACK_FILES.forEach(filename => {
      const track = {
        file: null,
        url: MUSIC_FOLDER + filename,
        name: niceName(filename),
        artist: 'Thư viện nhạc',
        duration: 0,
        peaks: defaultPeaks(72)
      };
      playlist.push(track);
      // Tính waveform ở nền, không chặn giao diện
      computePeaksUrl(track.url).then(p => { track.peaks = p; });
    });

    renderPlaylist();

    if (playlist.length){
      loadTrack(0, false);
    } else {
      trackArtist.textContent = 'Thêm nhạc để bắt đầu nghe';
    }
  }

  function removeTrack(index){
    const wasPlaying = index === currentIndex;
    if (playlist[index].file){
      URL.revokeObjectURL(playlist[index].url);
    }
    playlist.splice(index, 1);

    if (playlist.length === 0){
      currentIndex = -1;
      audioEl.pause();
      audioEl.removeAttribute('src');
      isPlaying = false;
      setPlayingUI(false);
      trackTitle.textContent = 'Chưa có bài hát';
      trackArtist.textContent = 'Thêm nhạc để bắt đầu nghe';
    } else if (wasPlaying){
      const next = Math.min(index, playlist.length - 1);
      loadTrack(next, isPlaying);
    } else if (index < currentIndex){
      currentIndex -= 1;
    }
    renderPlaylist();
  }

  function renderPlaylist(){
    playlistList.innerHTML = '';
    emptyHint.style.display = playlist.length ? 'none' : 'block';

    playlist.forEach((track, i) => {
      const li = document.createElement('li');
      li.className = 'playlist-item' + (i === currentIndex ? ' playing' : '');
      li.setAttribute('tabindex', '0');
      li.setAttribute('role', 'button');
      li.setAttribute('aria-label', 'Phát ' + track.name);

      li.innerHTML =
        '<span class="pl-index">' + (i === currentIndex && isPlaying ? eqIconSvg() : (i + 1)) + '</span>' +
        '<span class="pl-info">' +
          '<span class="pl-title">' + escapeHtml(track.name) + '</span>' +
          '<span class="pl-artist">' + escapeHtml(track.artist) + '</span>' +
        '</span>' +
        '<button class="pl-remove" aria-label="Xoá khỏi danh sách" title="Xoá">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
        '</button>';

      li.addEventListener('click', (e) => {
        if (e.target.closest('.pl-remove')) return;
        loadTrack(i, true);
      });
      li.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); loadTrack(i, true); }
      });
      li.querySelector('.pl-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(i);
      });

      playlistList.appendChild(li);
    });
  }

  function eqIconSvg(){
    return '<svg class="pl-eq" viewBox="0 0 14 14"><rect x="1" y="5" width="2.5" height="9" y-anim></rect><rect x="5.75" y="1" width="2.5" height="13"></rect><rect x="10.5" y="7" width="2.5" height="7"></rect></svg>';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Media Session (giữ nhạc chạy nền + điều khiển trên màn hình khoá) ----------
  // Khai báo cho hệ điều hành biết đây là một trình phát nhạc "thật" — giúp iOS/Android
  // không dừng audio khi khoá màn hình, đồng thời hiện nút play/pause/next/prev/seek
  // ngay trên lock screen và Control Center.
  const hasMediaSession = 'mediaSession' in navigator;

  function updateMediaSessionMetadata(track){
    if (!hasMediaSession || !track) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name || 'Đang phát',
        artist: track.artist || 'Amber',
        album: 'Amber — Trình phát nhạc'
      });
    } catch(e){ /* bỏ qua nếu trình duyệt không hỗ trợ */ }
  }

  function updateMediaSessionPositionState(){
    if (!hasMediaSession || !navigator.mediaSession.setPositionState) return;
    const duration = audioEl.duration;
    if (!isFinite(duration) || duration <= 0) return;
    try{
      navigator.mediaSession.setPositionState({
        duration: duration,
        playbackRate: audioEl.playbackRate || 1,
        position: Math.min(audioEl.currentTime, duration)
      });
    } catch(e){ /* một số trình duyệt cũ không hỗ trợ */ }
  }

  function setupMediaSessionHandlers(){
    if (!hasMediaSession) return;
    navigator.mediaSession.setActionHandler('play', () => { playTrack(); });
    navigator.mediaSession.setActionHandler('pause', () => { pauseTrack(); });
    navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
    navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
      const skip = details.seekOffset || 15;
      audioEl.currentTime = Math.max(0, audioEl.currentTime - skip);
      updateMediaSessionPositionState();
    });
    navigator.mediaSession.setActionHandler('seekforward', (details) => {
      const skip = details.seekOffset || 15;
      audioEl.currentTime = Math.min(audioEl.duration || Infinity, audioEl.currentTime + skip);
      updateMediaSessionPositionState();
    });
    try{
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.fastSeek && 'fastSeek' in audioEl){ audioEl.fastSeek(details.seekTime); return; }
        audioEl.currentTime = details.seekTime;
        updateMediaSessionPositionState();
      });
    } catch(e){ /* seekto không được hỗ trợ trên mọi trình duyệt */ }
  }

  // ---------- Playback ----------
  function loadTrack(index, autoplay){
    if (index < 0 || index >= playlist.length) return;
    currentIndex = index;
    const track = playlist[index];
    audioEl.src = track.url;
    trackTitle.textContent = track.name;
    trackArtist.textContent = track.artist;
    discLabel.textContent = track.name.charAt(0).toUpperCase() || '♪';
    document.getElementById('waveCanvas').setAttribute('aria-valuenow', '0');
    renderPlaylist();
    updateMediaSessionMetadata(track);
    if (autoplay){ playTrack(); } else { setPlayingUI(false); }
  }

  function playTrack(){
    if (currentIndex === -1 && playlist.length) { loadTrack(0, true); return; }
    const p = audioEl.play();
    if (p && p.catch) p.catch(() => {});
    isPlaying = true;
    setPlayingUI(true);
    if (hasMediaSession) navigator.mediaSession.playbackState = 'playing';
  }

  function pauseTrack(){
    audioEl.pause();
    isPlaying = false;
    setPlayingUI(false);
    if (hasMediaSession) navigator.mediaSession.playbackState = 'paused';
  }

  function skipSeconds(delta){
    if (!playlist.length) return;
    const duration = audioEl.duration || 0;
    audioEl.currentTime = Math.max(0, Math.min(duration, audioEl.currentTime + delta));
    updateMediaSessionPositionState();
  }

  function togglePlay(){
    if (!playlist.length) return;
    isPlaying ? pauseTrack() : playTrack();
  }

  function setPlayingUI(playing){
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
    playBtn.setAttribute('aria-label', playing ? 'Tạm dừng' : 'Phát');
    disc.classList.toggle('spinning', playing && !reduceMotion);
    renderPlaylist();
  }

  function pickNextIndex(direction){
    if (!playlist.length) return -1;
    if (shuffle){
      if (playlist.length === 1) return 0;
      let idx;
      do { idx = Math.floor(Math.random() * playlist.length); } while (idx === currentIndex);
      return idx;
    }
    let idx = currentIndex + direction;
    if (idx >= playlist.length) idx = 0;
    if (idx < 0) idx = playlist.length - 1;
    return idx;
  }

  function nextTrack(){ if (playlist.length) loadTrack(pickNextIndex(1), true); }
  function prevTrack(){
    if (!playlist.length) return;
    if (audioEl.currentTime > 3){ audioEl.currentTime = 0; return; }
    loadTrack(pickNextIndex(-1), true);
  }

  audioEl.addEventListener('ended', () => {
    if (repeatMode === 'one'){
      audioEl.currentTime = 0;
      playTrack();
    } else if (repeatMode === 'all' || currentIndex < playlist.length - 1){
      nextTrack();
    } else {
      isPlaying = false;
      setPlayingUI(false);
    }
  });

  audioEl.addEventListener('loadedmetadata', () => {
    if (playlist[currentIndex]) playlist[currentIndex].duration = audioEl.duration;
    durTimeEl.textContent = fmtTime(audioEl.duration);
    updateMediaSessionPositionState();
  });

  audioEl.addEventListener('timeupdate', updateMediaSessionPositionState);
  audioEl.addEventListener('seeked', updateMediaSessionPositionState);

  audioEl.addEventListener('error', () => {
    // Nếu file nhạc không tồn tại / đường dẫn sai, không chặn toàn bộ trình phát
    if (playlist[currentIndex]){
      trackArtist.textContent = 'Không tải được file: ' + playlist[currentIndex].url;
    }
  });

  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', nextTrack);
  prevBtn.addEventListener('click', prevTrack);
  back15Btn.addEventListener('click', () => skipSeconds(-15));
  fwd15Btn.addEventListener('click', () => skipSeconds(15));
  setupMediaSessionHandlers();

  shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    shuffleBtn.classList.toggle('active', shuffle);
    shuffleBtn.setAttribute('aria-pressed', String(shuffle));
  });

  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
    repeatBtn.classList.toggle('active', repeatMode !== 'off');
    repeatBtn.setAttribute('aria-pressed', String(repeatMode !== 'off'));
    repeatBtn.title = repeatMode === 'off' ? 'Lặp lại' : (repeatMode === 'all' ? 'Lặp lại tất cả' : 'Lặp lại 1 bài');
  });

  volumeSlider.addEventListener('input', () => { audioEl.volume = parseFloat(volumeSlider.value); });
  audioEl.volume = parseFloat(volumeSlider.value);

  // ---------- Mobile playlist toggle ----------
  playlistToggle.addEventListener('click', () => {
    const open = playlistPanel.classList.toggle('open');
    playlistToggle.setAttribute('aria-label', open ? 'Đóng danh sách phát' : 'Mở danh sách phát');
  });

  // ---------- Keyboard shortcuts ----------
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if (e.shiftKey && e.code === 'ArrowRight'){ skipSeconds(15); }
    else if (e.shiftKey && e.code === 'ArrowLeft'){ skipSeconds(-15); }
    else if (e.code === 'ArrowRight'){ audioEl.currentTime = Math.min(audioEl.duration || 0, audioEl.currentTime + 5); }
    else if (e.code === 'ArrowLeft'){ audioEl.currentTime = Math.max(0, audioEl.currentTime - 5); }
  });

  // =====================================================================
  // CANVAS: falling ambient bars (background)
  // =====================================================================
  const bgCtx = bgCanvas.getContext('2d');
  let bgParticles = [];

  function resizeBg(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bgCanvas.width = window.innerWidth * dpr;
    bgCanvas.height = window.innerHeight * dpr;
    bgCanvas.style.width = window.innerWidth + 'px';
    bgCanvas.style.height = window.innerHeight + 'px';
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initBgParticles();
  }

  function initBgParticles(){
    const count = Math.floor(window.innerWidth / 26);
    bgParticles = Array.from({length: count}, () => makeParticle(true));
  }

  function makeParticle(randomY){
    return {
      x: Math.random() * window.innerWidth,
      y: randomY ? Math.random() * window.innerHeight : -20,
      w: 2 + Math.random() * 3,
      h: 14 + Math.random() * 46,
      speed: 10 + Math.random() * 26,
      opacity: 0.04 + Math.random() * 0.14,
      hueShift: Math.random()
    };
  }

  let lastFrame = performance.now();

  function drawBg(dt){
    bgCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    bgParticles.forEach(p => {
      p.y += p.speed * dt * (reduceMotion ? 0.15 : 1);
      if (p.y > window.innerHeight + p.h){
        Object.assign(p, makeParticle(false));
      }
      const grad = bgCtx.createLinearGradient(0, p.y, 0, p.y + p.h);
      grad.addColorStop(0, 'rgba(232,167,82,' + p.opacity + ')');
      grad.addColorStop(1, 'rgba(196,112,63,0)');
      bgCtx.fillStyle = grad;
      roundRect(bgCtx, p.x, p.y, p.w, p.h, p.w / 2);
      bgCtx.fill();
    });
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // =====================================================================
  // CANVAS: circular frequency ring around the disc
  // =====================================================================
  const ringCtx = ringCanvas.getContext('2d');
  let ringSize = 400;

  function resizeRing(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = ringCanvas.getBoundingClientRect();
    ringSize = rect.width;
    ringCanvas.width = rect.width * dpr;
    ringCanvas.height = rect.height * dpr;
    ringCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawRing(){
    const w = ringSize, h = ringSize;
    ringCtx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const baseR = w * 0.34;
    const bars = 64;

    let amp = new Array(bars).fill(0.05);
    if (isPlaying){
      const t = performance.now() / 1000;
      for (let i = 0; i < bars; i++){
        amp[i] = Math.max(0.05, getFakeAmplitude(t + i * 0.18));
      }
    }

    for (let i = 0; i < bars; i++){
      const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
      const len = 8 + amp[i] * (w * 0.15);
      const x1 = cx + Math.cos(angle) * baseR;
      const y1 = cy + Math.sin(angle) * baseR;
      const x2 = cx + Math.cos(angle) * (baseR + len);
      const y2 = cy + Math.sin(angle) * (baseR + len);
      ringCtx.strokeStyle = 'rgba(232,167,82,' + (0.25 + amp[i] * 0.6) + ')';
      ringCtx.lineWidth = 2.4;
      ringCtx.lineCap = 'round';
      ringCtx.beginPath();
      ringCtx.moveTo(x1, y1);
      ringCtx.lineTo(x2, y2);
      ringCtx.stroke();
    }
  }

  // =====================================================================
  // CANVAS: waveform seek bar (progress + live "bobbing")
  // =====================================================================
  const waveCtx = waveCanvas.getContext('2d');
  let waveW = 640, waveH = 64;

  function resizeWave(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = waveCanvas.getBoundingClientRect();
    waveW = rect.width;
    waveH = rect.height;
    waveCanvas.width = rect.width * dpr;
    waveCanvas.height = rect.height * dpr;
    waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawWave(){
    waveCtx.clearRect(0, 0, waveW, waveH);
    const track = playlist[currentIndex];
    const peaks = (track && track.peaks) || defaultPeaks(72);
    const n = peaks.length;
    const gap = 3;
    const barW = Math.max(1.5, (waveW - gap * (n - 1)) / n);
    const midY = waveH / 2;

    const duration = audioEl.duration || (track ? track.duration : 0) || 0;
    const progress = duration ? (audioEl.currentTime / duration) : 0;
    const progressIdx = progress * n;

    let liveAmp = 0;
    if (isPlaying) liveAmp = getLiveAmplitude();

    for (let i = 0; i < n; i++){
      const played = i < progressIdx;
      let x = i * (barW + gap);
      let barH;

      if (played){
        barH = Math.max(4, peaks[i] * (waveH * 0.86));
        const distFromHead = progressIdx - i;
        if (isPlaying && distFromHead < 6){
          const influence = 1 - distFromHead / 6;
          barH *= 1 + liveAmp * 0.9 * influence;
        }
        barH = Math.min(barH, waveH);
        const grad = waveCtx.createLinearGradient(0, midY - barH / 2, 0, midY + barH / 2);
        grad.addColorStop(0, '#FFC773');
        grad.addColorStop(1, '#C4703F');
        waveCtx.fillStyle = grad;
        roundRect(waveCtx, x, midY - barH / 2, barW, barH, barW / 2);
        waveCtx.fill();
      } else {
        barH = 4;
        waveCtx.fillStyle = 'rgba(156,145,130,0.35)';
        roundRect(waveCtx, x, midY - barH / 2, barW, barH, barW / 2);
        waveCtx.fill();
      }
    }

    waveCanvas.setAttribute('aria-valuenow', String(Math.round(progress * 100)));
  }

  function seekFromClientX(clientX){
    const rect = waveCanvas.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    const duration = audioEl.duration || 0;
    if (duration) audioEl.currentTime = ratio * duration;
  }

  waveCanvas.addEventListener('pointerdown', (e) => {
    if (!playlist.length) return;
    seeking = true;
    seekFromClientX(e.clientX);
    waveCanvas.setPointerCapture(e.pointerId);
  });
  waveCanvas.addEventListener('pointermove', (e) => { if (seeking) seekFromClientX(e.clientX); });
  waveCanvas.addEventListener('pointerup', () => { seeking = false; });
  waveCanvas.addEventListener('keydown', (e) => {
    const duration = audioEl.duration || 0;
    if (!duration) return;
    if (e.key === 'ArrowRight'){ audioEl.currentTime = Math.min(duration, audioEl.currentTime + 5); }
    else if (e.key === 'ArrowLeft'){ audioEl.currentTime = Math.max(0, audioEl.currentTime - 5); }
  });

  // ---------- Time display loop ----------
  function updateTimeDisplay(){
    curTimeEl.textContent = fmtTime(audioEl.currentTime);
    durTimeEl.textContent = fmtTime(audioEl.duration || (playlist[currentIndex] ? playlist[currentIndex].duration : 0));
  }

  // ---------- Master animation loop ----------
  function frame(now){
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    drawBg(dt);
    drawRing();
    drawWave();
    if (!seeking) updateTimeDisplay();

    requestAnimationFrame(frame);
  }

  function resizeAll(){
    resizeBg();
    resizeRing();
    resizeWave();
  }

  window.addEventListener('resize', resizeAll);
  resizeAll();
  requestAnimationFrame(frame);
  renderPlaylist();
  loadManualTracks();
})();
</script>
</body>
</html>
