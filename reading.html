<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện phỏng vấn tiếng Hàn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f5f5;
      --surface: #fff;
      --border: #ddd;
      --text: #222;
      --text-sub: #666;
      --text-muted: #999;
      --text-roman: #534AB7;
      --accent: #7F77DD;
      --accent-bg: #EEEDFE;
      --accent-text: #3C3489;
      --hover-bg: #f0f0f0;
      --card-hover: #fafafa;
      --danger: #A32D2D;
      --control-bg: #fff;
      --control-color: #222;
    }

    body.dark {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #2d3561;
      --text: #e0e0e0;
      --text-sub: #a0a0b0;
      --text-muted: #606080;
      --text-roman: #9b94f0;
      --accent: #7F77DD;
      --accent-bg: #1e1b4b;
      --accent-text: #c4bfff;
      --hover-bg: #0f3460;
      --card-hover: #1c2952;
      --danger: #e05c5c;
      --control-bg: #16213e;
      --control-color: #e0e0e0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: background 0.25s, color 0.25s;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--hover-bg);
    }

    .icon-btn.muted {
      background: #fff0f0;
      border-color: var(--danger);
      color: var(--danger);
    }

    body.dark .icon-btn.muted {
      background: #3a1a1a;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .btn:hover {
      background: var(--hover-bg);
    }

    .btn.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .speed-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .toggle-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toggle-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-sub);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .toggle-btn.on {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sentence-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .sentence-card:hover {
      border-color: #aaa;
      background: var(--card-hover);
    }

    .sentence-card.playing {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .card-content {
      flex: 1;
      min-width: 0;
    }

    .sentence-num {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .korean {
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .romanization {
      font-size: 12px;
      color: var(--text-roman);
      font-family: monospace;
      line-height: 1.5;
      margin-bottom: 3px;
    }

    .vietnamese {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .mini-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .mini-btn:hover {
      background: var(--hover-bg);
    }

    .mini-btn.loop-on {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .loop-counter {
      font-size: 10px;
      text-align: center;
      color: var(--text-muted);
      min-width: 30px;
    }

    .loop-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .autoplay-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
    }

    .mute-banner {
      display: none;
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      margin-bottom: 10px;
      text-align: center;
    }

    body.dark .mute-banner {
      background: #3a2e00;
      border-color: #b8860b;
      color: #ffd966;
    }

    .mute-banner.show { display: block; }

    input[type=range] {
      accent-color: var(--accent);
    }

    select {
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--control-bg);
      color: var(--control-color);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <h1>🎧 Luyện phỏng vấn tiếng Hàn</h1>
    <div class="top-actions">
      <button class="icon-btn" id="btn-mute" onclick="toggleMute()" title="Bật/tắt tiếng">🔊</button>
      <button class="icon-btn" id="btn-theme" onclick="toggleTheme()" title="Chế độ sáng/tối">🌙</button>
    </div>
  </div>
  <p class="subtitle">Nhấn vào từng câu để nghe, hoặc phát toàn bộ bài. Nhấn 🔁 để lặp 1 câu.</p>
  <div class="mute-banner" id="mute-banner">🔇 Đang tắt tiếng — bấm 🔇 ở góc trên để bật lại</div>

  <div class="toggle-row">
    <button class="toggle-btn on" id="tog-korean" onclick="toggleView('korean')">Chữ Hàn</button>
    <button class="toggle-btn on" id="tog-roman" onclick="toggleView('roman')">Phiên âm</button>
    <button class="toggle-btn on" id="tog-viet" onclick="toggleView('viet')">Nghĩa tiếng Việt</button>
  </div>

  <div class="controls">
    <button class="btn" id="btn-play-all" onclick="playAll()">▶ Phát toàn bộ</button>
    <button class="btn danger" id="btn-stop" onclick="stopAll()" style="display:none">⏹ Dừng</button>
    <button class="btn" onclick="resetAll()">↺ Làm lại</button>
    <div class="speed-row">
      <span>Tốc độ:</span>
      <input type="range" min="0.5" max="1.2" step="0.1" value="0.8" id="speed-slider" style="width:80px"
        oninput="updateSpeed(this.value)">
      <span id="speed-val">0.8x</span>
    </div>
    <div class="loop-controls">
      🔁 <span>Lặp:</span>
      <select id="loop-count-select" onchange="updateLoopDefault(this.value)">
        <option value="3">3 lần</option>
        <option value="5">5 lần</option>
        <option value="10">10 lần</option>
        <option value="99">Vô hạn</option>
      </select>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>
  <div class="sentence-list" id="sentence-list"></div>
  <div class="autoplay-info" id="autoplay-info"></div>

  <script>
    const sentences = [
      { korean: "안녕하십니까.", roman: "an-nhông-ha-sim-ni-ka", viet: "Xin chào." },
      { korean: "저는 라반상이라고 합니다.", roman: "chơ-nưn la-ban-sang-i-ra-gô ham-ni-da", viet: "Tôi tên là La Văn Sang, đến từ Hà Nội." },
      { korean: "올해 스물두 살입니다.", roman: "ôl-he sư-mul-tu sal im-ni-da", viet: "Năm nay tôi 22 tuổi." },
      { korean: "저는 2022년에 고등학교를 졸업했고, 2025년에 전문대학교를 졸업했습니다.", roman: "chơ-nưn i-chon-i-sip-i-nhơ-nê cô-đưng-hắc-kyo-rưl cho-rốp-hét-cô, i-chon-i-sip-o-nhơ-nê chon-mun-de-hắc-kyo-rưl cho-rốp-hét-sưm-ni-da", viet: "Tôi tốt nghiệp trung học năm 2022 và tốt nghiệp cao đẳng năm 2025." },
      { korean: "가족은 부모님과 저, 총 3명입니다.", roman: "ca-chô-gưn bu-mo-nim-gwa chơ, chông sam-myông-im-ni-da", viet: "Gia đình gồm bố mẹ và tôi, tổng cộng 3 người." },
      { korean: "아버지는 57세이시고, 어머니는 49세이십니다.", roman: "a-bơ-chi-nưn o-sip-chil-sê-i-si-gô, ô-mô-ni-nưn sa-sip-gu-sê-i-sim-ni-da", viet: "Bố tôi 57 tuổi và mẹ tôi 49 tuổi." },
      { korean: "아버지와 어머니는 화분 사업을 하고 계십니다.", roman: "a-bơ-chi-wa ô-mô-ni-nưn hoa-bun sa-ôp-ưl ha-gô ghê-sim-ni-da", viet: "Bố và mẹ tôi đang kinh doanh chậu hoa." },
      { korean: "제 취미는 한국 음악 듣기와 한국 영화 보기입니다.", roman: "chê chwi-mi-nưn han-guk ưm-ak đưt-gi-wa han-guk yông-hoa bo-gi-im-ni-da", viet: "Sở thích của tôi là nghe nhạc Hàn Quốc và xem phim Hàn Quốc." },
      { korean: "저는 명지대학교 학생이 되면 열심히 공부하겠습니다.", roman: "chơ-nưn myông-chi-đe-hắc-kyo hắc-seng-i đoê-myôn yôl-sim-hi công-bu-ha-ghét-sưm-ni-da", viet: "Nếu trở thành sinh viên của Đại học Myongji, tôi sẽ học tập thật chăm chỉ." },
      { korean: "잘 부탁 드립니다.", roman: "chal bu-thắc đư-rim-ni-da", viet: "Rất mong được sự quan tâm của mọi người." },
      { korean: "감사합니다.", roman: "kam-sa-ham-ni-da", viet: "Xin cảm ơn." }
    ];

    let currentIdx = -1, isPlaying = false, autoplayTimeout = null, speed = 0.8;
    let showRoman = true, showViet = true, showKorean = true;
    let loopIdx = -1, loopCount = 0, loopMax = 3, loopTimeout = null, isLooping = false;
    let loopDefaultMax = 3;
    let isMuted = false;
    const synth = window.speechSynthesis;

    function toggleTheme() {
      const dark = document.body.classList.toggle('dark');
      document.getElementById('btn-theme').textContent = dark ? '☀️' : '🌙';
      document.getElementById('btn-theme').title = dark ? 'Chuyển sang sáng' : 'Chuyển sang tối';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('btn-mute');
      const banner = document.getElementById('mute-banner');
      if (isMuted) {
        btn.textContent = '🔇';
        btn.classList.add('muted');
        btn.title = 'Bật tiếng';
        banner.classList.add('show');
        synth.cancel();
        if (isPlaying) stopAll();
        if (isLooping) stopLoop();
      } else {
        btn.textContent = '🔊';
        btn.classList.remove('muted');
        btn.title = 'Tắt tiếng';
        banner.classList.remove('show');
      }
    }

    // Restore theme on load
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('btn-theme').textContent = '☀️';
    }

    function toggleView(type) {
      if (type === 'roman') { showRoman = !showRoman; document.getElementById('tog-roman').classList.toggle('on', showRoman); }
      if (type === 'viet') { showViet = !showViet; document.getElementById('tog-viet').classList.toggle('on', showViet); }
      if (type === 'korean') { showKorean = !showKorean; document.getElementById('tog-korean').classList.toggle('on', showKorean); }
      renderList();
    }

    function updateSpeed(v) {
      speed = parseFloat(v);
      document.getElementById('speed-val').textContent = speed.toFixed(1) + 'x';
    }

    function updateLoopDefault(v) {
      loopDefaultMax = parseInt(v);
    }

    function speakKorean(text, onEnd) {
      synth.cancel();
      if (isMuted) {
        if (onEnd) setTimeout(onEnd, 0);
        return;
      }
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'ko-KR'; utt.rate = speed;
      utt.onend = onEnd || null;
      synth.speak(utt);
    }

    function startLoop(idx) {
      stopAll();
      loopIdx = idx;
      loopMax = loopDefaultMax;
      loopCount = 0;
      isLooping = true;
      currentIdx = idx;
      setActive(idx);
      updateLoopCounter(idx);
      playLoopStep();
    }

    function playLoopStep() {
      if (!isLooping || loopIdx < 0) return;
      const infinite = loopMax === 99;
      if (!infinite && loopCount >= loopMax) {
        stopLoop();
        return;
      }
      loopCount++;
      updateLoopCounter(loopIdx);
      document.getElementById('autoplay-info').textContent = infinite
        ? `Đang lặp câu ${loopIdx + 1} — lần ${loopCount}...`
        : `Đang lặp câu ${loopIdx + 1} — lần ${loopCount}/${loopMax}`;
      speakKorean(sentences[loopIdx].korean, () => {
        if (!isLooping) return;
        loopTimeout = setTimeout(() => playLoopStep(), 500);
      });
    }

    function stopLoop() {
      isLooping = false;
      synth.cancel();
      clearTimeout(loopTimeout);
      const old = loopIdx;
      loopIdx = -1;
      loopCount = 0;
      currentIdx = -1;
      setActive(-1);
      document.getElementById('autoplay-info').textContent = '';
      if (old >= 0) updateLoopCounter(old);
    }

    function toggleLoop(idx, e) {
      e.stopPropagation();
      if (isLooping && loopIdx === idx) {
        stopLoop();
      } else {
        startLoop(idx);
      }
    }

    function updateLoopCounter(idx) {
      const el = document.getElementById('loop-cnt-' + idx);
      if (!el) return;
      const btn = document.getElementById('loop-btn-' + idx);
      if (isLooping && loopIdx === idx) {
        const infinite = loopMax === 99;
        el.textContent = infinite ? '∞' : loopCount + '/' + loopMax;
        btn.classList.add('loop-on');
        btn.textContent = '⏹';
        btn.title = 'Dừng lặp';
      } else {
        el.textContent = '';
        btn.classList.remove('loop-on');
        btn.textContent = '🔁';
        btn.title = 'Lặp câu này';
      }
    }

    function renderList() {
      const list = document.getElementById('sentence-list');
      list.innerHTML = sentences.map((s, i) => `
    <div class="sentence-card ${i === currentIdx ? 'playing' : ''}" id="card-${i}" onclick="playSingle(${i})">
      <div class="card-content">
        <div class="sentence-num">Câu ${i + 1} / ${sentences.length}</div>
        ${showKorean ? `<div class="korean">${s.korean}</div>` : ''}
        ${showRoman ? `<div class="romanization">${s.roman}</div>` : ''}
        ${showViet ? `<div class="vietnamese">${s.viet}</div>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="mini-btn" id="loop-btn-${i}" onclick="toggleLoop(${i}, event)" title="Lặp câu này">🔁</button>
        <div class="loop-counter" id="loop-cnt-${i}"></div>
      </div>
    </div>`).join('');
    }

    function setActive(idx) {
      document.querySelectorAll('.sentence-card').forEach((c, i) => c.classList.toggle('playing', i === idx));
      if (idx >= 0) document.getElementById('card-' + idx)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById('progress').style.width = idx >= 0 ? Math.round(((idx + 1) / sentences.length) * 100) + '%' : '0%';
    }

    function playSingle(idx) {
      if (isLooping) stopLoop();
      stopAll();
      currentIdx = idx; setActive(idx); speakKorean(sentences[idx].korean);
    }

    function playAll() {
      if (isLooping) stopLoop();
      stopAll(); isPlaying = true;
      document.getElementById('btn-play-all').style.display = 'none';
      document.getElementById('btn-stop').style.display = '';
      playNext(0);
    }

    function playNext(idx) {
      if (!isPlaying || idx >= sentences.length) {
        if (idx >= sentences.length) {
          document.getElementById('autoplay-info').textContent = '✓ Đã phát xong toàn bộ bài!';
          document.getElementById('btn-play-all').style.display = '';
          document.getElementById('btn-stop').style.display = 'none';
          isPlaying = false; setActive(-1);
        }
        return;
      }
      currentIdx = idx; setActive(idx);
      document.getElementById('autoplay-info').textContent = `Đang phát câu ${idx + 1}/${sentences.length}...`;
      speakKorean(sentences[idx].korean, () => {
        if (!isPlaying) return;
        autoplayTimeout = setTimeout(() => playNext(idx + 1), 600);
      });
    }

    function stopAll() {
      isPlaying = false; synth.cancel(); clearTimeout(autoplayTimeout);
      document.getElementById('btn-play-all').style.display = '';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('autoplay-info').textContent = '';
      setActive(-1); currentIdx = -1;
    }

    function resetAll() {
      if (isLooping) stopLoop();
      stopAll();
      document.getElementById('progress').style.width = '0%';
    }

    renderList();
  </script>
</body>

</html>
